name: Build WeintCompanion

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, für das das Release erstellt werden soll (z. B. v0.9.0)"
        required: true

permissions:
  contents: write

jobs:

  #
  # Läuft vor allem anderen und bricht ab, wenn der Tag nicht zu den
  # Versionsnummern im Repo passt.
  #
  # Der Fall, den das verhindert, ist dreimal passiert (v1.2.0,
  # v1.2.1, v1.2.4): getaggt wurde ein Stand ohne die zugehörige
  # Versionserhöhung. Nichts schlägt dabei fehl - der Build ist grün,
  # das Release entsteht, die Installation läuft. Erst der Updater
  # fällt auf, und zwar unbehebbar: er sieht ein neueres Release,
  # installiert es und meldet danach unverändert die alte Version.
  #

  version:

    runs-on: ubuntu-latest

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag gegen core/version.py, installer.iss und Changelog prüfen
        run: >
          python scripts/check_version.py
          "${{ github.event.inputs.tag || github.ref_name }}"

  test:

    needs: version

    runs-on: ubuntu-latest

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      #
      # httpx gehoert dazu: die Tests der HTTP-Haelften (WeakAura-
      # Bibliothek, letzter Pull, Discord-Verknuepfungen) ueberspringen
      # sich ohne die Abhaengigkeit selbst. Das ist richtig fuer einen
      # Lauf am Schreibtisch, in der CI aber ein stiller Verlust an
      # Abdeckung - und wer den Riegel vergisst, bekommt statt eines
      # Skips einen Abbruch beim Einsammeln.
      #

      - name: Test-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx

      - name: Tests ausführen
        run: python -m pytest tests/ -v

  linux:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: linuxdeploy herunterladen
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

      - name: Linux Build
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh

      - name: AppImage erstellen
        run: |
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh

      - name: Prüfsumme erstellen
        run: sha256sum WeintCompanion-x86_64.AppImage > WeintCompanion-x86_64.AppImage.sha256

      - name: Linux Build hochladen
        uses: actions/upload-artifact@v4
        with:
          name: WeintCompanion-Linux
          path: |
            WeintCompanion-x86_64.AppImage
            WeintCompanion-x86_64.AppImage.sha256

  windows:

    needs: test

    runs-on: windows-latest

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Windows Build
        shell: powershell
        run: |
          ./scripts/build_windows.ps1

      - name: Prüfsumme erstellen
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/WeintCompanion-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WeintCompanion-Setup.exe" | Out-File -Encoding ascii dist/WeintCompanion-Setup.exe.sha256

      - name: Windows Build hochladen
        uses: actions/upload-artifact@v4
        with:
          name: WeintCompanion-Windows
          path: |
            dist/WeintCompanion-Setup.exe
            dist/WeintCompanion-Setup.exe.sha256

  release:

    needs:
      - linux
      - windows

    runs-on: ubuntu-latest

    steps:

      #
      # Der Release-Text ist der Changelog-Abschnitt dieses Tags, nicht
      # die von GitHub erzeugte Commit-Liste. Nur so steht in der App
      # unter "Addon & Updates" und in der Änderungsansicht derselbe
      # Text wie auf GitHub - und zwar einer, der für Spieler
      # geschrieben ist. Der Abschnitt existiert garantiert: der
      # version-Job oben bricht sonst ab.
      #

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Release-Text aus dem Changelog holen
        run: >
          python scripts/release_notes.py
          "${{ github.event.inputs.tag || github.ref_name }}"
          > release-notes.md

      - name: Linux Build herunterladen
        uses: actions/download-artifact@v4
        with:
          name: WeintCompanion-Linux
          path: release/linux

      - name: Windows Build herunterladen
        uses: actions/download-artifact@v4
        with:
          name: WeintCompanion-Windows
          path: release/windows

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          #
          # Bei einem echten Tag-Push (v*) ist github.ref_name bereits der
          # Tag-Name. Bei manuellem workflow_dispatch (z. B. weil der
          # eigentliche Tag-Push keinen Workflow-Run ausgelöst hat) läuft
          # der Job stattdessen gegen einen Branch - ohne den expliziten
          # "tag"-Input würde die Action mangels Tag-Kontext fehlschlagen.
          #
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: false
          files: |
            release/windows/WeintCompanion-Setup.exe
            release/windows/WeintCompanion-Setup.exe.sha256
            release/linux/WeintCompanion-x86_64.AppImage
            release/linux/WeintCompanion-x86_64.AppImage.sha256